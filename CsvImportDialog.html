<body>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Finlandica:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/gh/mats-k/sweden-sans@master/sweden-sans.css" rel="stylesheet" />
  <link href="https://fonts.cdnfonts.com/css/elometha" rel="stylesheet" />

  <div class="modal-frame">

    <div class="modal-header">
      <div class="header-top-row">
        <div class="header-left">
          <?!= renderPublicLogo_('stuteri-logo-left'); ?>
          <div class="brand-text-stacked">
            <span class="header-brand-title"><?= getBranding_().name ?></span>
            <span class="script-text stuteri-text-sub"><?= getBranding_().signature ?></span>
          </div>
        </div>
        <div class="header-center">
          <div class="title-container"><h1>CSV Import</h1></div>
        </div>
        <div class="header-right"></div>
      </div>
    </div>

    <div class="content-container">

      <div class="import-card">
        <div class="section-title">Import Profile</div>
        <div class="input-group">
          <label for="profileSelect" class="field-label">What are you importing?</label>
          <select id="profileSelect" class="import-input">
            <option value="">Loading profiles...</option>
          </select>
        </div>

        <p class="import-helper-text">Paste CSV content here (with header row). Only known columns are used, empty rows in the target sheet are filled in, formulas stay untouched.</p>

        <div class="input-group">
          <label for="csvInput" class="field-label">CSV Content</label>
          <textarea id="csvInput" class="import-textarea" placeholder="ID,Name,..."></textarea>
        </div>

        <div id="status"></div>

        <button id="importBtn" class="btn-primary-action" onclick="runImport()">Import</button>
      </div>

    </div>
  </div>

  <script>
    // Profile beim Öffnen des Dialogs laden
    google.script.run.withSuccessHandler(function (profiles) {
      var select = document.getElementById('profileSelect');
      select.innerHTML = '';
      profiles.forEach(function (p) {
        var opt = document.createElement('option');
        opt.value = p.key;
        opt.textContent = p.label;
        select.appendChild(opt);
      });
    }).getImportProfiles();

    function runImport() {
      var csvText = document.getElementById('csvInput').value;
      var profileKey = document.getElementById('profileSelect').value;
      var statusEl = document.getElementById('status');
      var btn = document.getElementById('importBtn');

      if (!profileKey) {
        statusEl.className = 'error';
        statusEl.textContent = 'Please select a profile first.';
        return;
      }
      if (!csvText.trim()) {
        statusEl.className = 'error';
        statusEl.textContent = 'Please paste CSV text first.';
        return;
      }

      btn.disabled = true;
      statusEl.className = 'info';
      statusEl.textContent = 'Importing...';

      google.script.run
        .withSuccessHandler(function (result) {
          btn.disabled = false;
          statusEl.className = 'success';
          var msg = 'Done: ' + result.written + ' rows/cells updated, ' +
            result.appended + ' newly added' +
            (result.skipped ? ', ' + result.skipped + ' skipped (no ID).' : '.');
          if (result.historyValuesWritten !== undefined) {
            msg += ' ' + result.historyValuesWritten + ' score values transferred.';
          }
          statusEl.textContent = msg;
        })
        .withFailureHandler(function (error) {
          btn.disabled = false;
          statusEl.className = 'error';
          statusEl.textContent = 'Error: ' + error.message;
        })
        .processCsvText(csvText, profileKey);
    }
  </script>
<?!= renderModalHelp('csv'); ?>
</body>
