          <div class="stats-sub-box">
            <div class="stats-sub-title">Competitions</div>
            <div class="stats-sub-row"><label><span>1</span>st Prize</label><input type="text" id="man_first" class="stats-input" placeholder="e.g. 3"></div>
            <div class="stats-sub-row"><label><span>2</span>nd Prize</label><input type="text" id="man_second" class="stats-input" placeholder="e.g. 7"></div>
            <div class="stats-sub-row"><label><span>3</span>rd Prize</label><input type="text" id="man_third" class="stats-input" placeholder="e.g. 4"></div>
          </div>
        </div>
      </div>

      <!-- STATUS MESSAGE -->
      <div id="statusMessage" class="status-message"></div>

      <!-- BUTTONS -->
      <div class="buttons-row">
        <div class="buttons-row-right" style="justify-content: flex-end; width: 100%;">
          <button type="button" class="modal-btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="button" id="saveBtn" class="btn-primary-action" onclick="saveScores()">Save</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    let horseList = [];
    let debounceTimer = null;

    document.addEventListener('DOMContentLoaded', function() {
      google.script.run
        .withSuccessHandler(function(list) {
          horseList = list;
          console.log('Horse list loaded: ' + horseList.length + ' entries');
        })
        .withFailureHandler(function(err) {
          console.error('Failed to load horse list: ' + err.message);
        })
        .getHorseListForSearch();

      setupAutocomplete();
    });

    function setupAutocomplete() {
      var input = document.getElementById('horseSearch');
      var dropdown = document.getElementById('autocompleteDropdown');

      input.addEventListener('input', function() {
        clearTimeout(debounceTimer);
        var query = this.value.trim().toLowerCase();

        if (query.length < 1) {
          dropdown.style.display = 'none';
          return;
        }

        debounceTimer = setTimeout(function() {
          var filtered = horseList.filter(h => 
            h.name.toLowerCase().includes(query) || 
            h.id.toLowerCase().includes(query)
          ).slice(0, 10);

          if (filtered.length === 0) {
            dropdown.style.display = 'none';
            return;
          }

          dropdown.innerHTML = filtered.map(h => 
            '<div class="autocomplete-item" onclick="selectHorse(\'' + h.id + '\', \'' + h.name.replace(/'/g, "\\'") + '\')">' +
            '<strong>' + h.name + '</strong> <span>(ID: ' + h.id + ')</span>' +
            '</div>'
          ).join('');

          dropdown.style.display = 'block';
          dropdown.style.position = 'absolute';
          dropdown.style.width = input.offsetWidth + 'px';
          dropdown.style.top = (input.offsetTop + input.offsetHeight + 4) + 'px';
          dropdown.style.left = input.offsetLeft + 'px';
        }, 150);
      });

      input.addEventListener('focus', function() {
        if (this.value.trim().length > 0) {
          input.dispatchEvent(new Event('input'));
        }
      });

      document.addEventListener('click', function(e) {
        if (!dropdown.contains(e.target) && e.target !== input) {
          dropdown.style.display = 'none';
        }
      });
    }

    function selectHorse(id, name) {
      document.getElementById('horseSearch').value = name;
      document.getElementById('selectedHorseId').value = id;
      document.getElementById('selectedHorseName').value = name;
      document.getElementById('autocompleteDropdown').style.display = 'none';
    }

    function saveScores() {
      var btn = document.getElementById('saveBtn');
      var statusEl = document.getElementById('statusMessage');
      
      var horseId = document.getElementById('selectedHorseId').value;
      var horseName = document.getElementById('selectedHorseName').value;
      var target = document.getElementById('resultType').value;
      var scoresText = document.getElementById('scoresInput').value;

      if (!horseId) {
        statusEl.className = 'status-message error';
        statusEl.textContent = '❌ Please select a horse first!';
        return;
      }

      if (!scoresText.trim()) {
        statusEl.className = 'status-message error';
        statusEl.textContent = '❌ Please enter at least one score!';
        return;
      }

  
      var scoresArray = [];
      
      var regex = /\b\d{2}[,.]\d{3}\b/g;
      var matches = scoresText.match(regex);
      
      if (matches) {
        scoresArray = matches.map(s => s.replace(',', '.'));
      } else {
        var lines = scoresText.split('\n');
        for (var i = 0; i < lines.length; i++) {
          var line = lines.trim();
          if (line && !line.includes('-') && !line.includes('#') && !/[a-zA-Z]/.test(line)) {
            var cleaned = line.replace(',', '.');
            if (!isNaN(parseFloat(cleaned))) {
              scoresArray.push(cleaned);
            }
          }
        }
      }

      if (scoresArray.length === 0) {
        statusEl.className = 'status-message error';
        statusEl.textContent = '❌ No valid scores found in the text!';
        return;
      }

      var manStats = {
        dc: document.getElementById('man_dc').value.trim(),
        '1st': document.getElementById('man_1st').value.trim(),
        '2nd': document.getElementById('man_2nd').value.trim(),
        '3rd': document.getElementById('man_3rd').value.trim(),
        first: document.getElementById('man_first').value.trim(),
        second: document.getElementById('man_second').value.trim(),
        third: document.getElementById('man_third').value.trim()
      };

      Object.keys(manStats).forEach(key => {
        if (manStats[key] === '' || manStats[key] === undefined) {
          delete manStats[key];
        }
      });

      btn.disabled = true;
      btn.innerText = 'Saving...';
      statusEl.className = 'status-message loading';
      statusEl.textContent = '💾 Saving data...';

      var data = {
        id: horseId,
        name: horseName,
        target: target,
        scores: scoresArray,
        manStats: manStats
      };

      google.script.run
        .withSuccessHandler(function(result) {
          btn.disabled = false;
          btn.innerText = 'Save';
          
          if (result.success) {
            var msg = '✅ ' + result.message;
            if (result.duplicatesRemoved > 0) {
              msg += '\\n🧹 ' + result.duplicatesRemoved + ' duplicates removed';
            }
            if (result.statsUpdated) {
              msg += '\\n📊 Stats updated: ' + result.statsSheets.join(', ');
            }
            
            statusEl.className = 'status-message success';
            statusEl.textContent = msg;
            
            setTimeout(() => {
              closeModal();
              google.script.host.close();
            }, 2000);
          } else {
            statusEl.className = 'status-message error';
            statusEl.textContent = '❌ Error: ' + (result.error || 'Unknown');
          }
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.innerText = 'Save';
          statusEl.className = 'status-message error';
          statusEl.textContent = '❌ Server error: ' + err.message;
        })
        .saveBulkScores(data);
    }

    function cleanAllDuplicates() {
      if (!confirm('REALLY CLEAN UP ALL DUPLICATES IN BOTH RESULT SHEETS?\\n\\nThis action cannot be undone!')) {
        return;
      }

      var link = event.target;
      var originalText = link.textContent;
      var statusEl = document.getElementById('statusMessage');
      link.style.pointerEvents = 'none';
      link.style.opacity = '0.5';
      link.textContent = 'Cleaning...';
      statusEl.className = 'status-message info';
      statusEl.textContent = 'Cleaning up duplicates...';

      google.script.run
        .withSuccessHandler(function(result) {
          link.style.pointerEvents = '';
          link.style.opacity = '';
          link.textContent = originalText;

          if (result.success) {
            statusEl.className = 'status-message success';
            statusEl.textContent = result.message;
          } else {
            statusEl.className = 'status-message error';
            statusEl.textContent = 'Error: ' + result.error;
          }
        })
        .withFailureHandler(function(err) {
          link.style.pointerEvents = '';
          link.style.opacity = '';
          link.textContent = originalText;
          statusEl.className = 'status-message error';
          statusEl.textContent = 'Server error: ' + err.message;
        })
        .cleanAllDuplicatesInSheet('all');
    }

    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('[data-tip]').forEach(function(el) {
        var imgSrc = el.getAttribute('data-img') || '';

        el.addEventListener('mouseenter', function(e) {
          removeTooltip();
          var tip = document.createElement('div');
          tip.className = 'floating-tooltip';
          tip.textContent = el.getAttribute('data-tip') || 'No info';
          document.body.appendChild(tip);
          positionTooltip(e, tip);
        });
        el.addEventListener('mousemove', function(e) {
          var tip = document.querySelector('.floating-tooltip');
          if (tip) positionTooltip(e, tip);
        });
        el.addEventListener('mouseleave', function() {
          removeTooltip();
        });

        el.addEventListener('click', function(e) {
          if (!imgSrc) return;
          e.stopPropagation();
          removeTooltip();

          var old = document.querySelector('.lightbox-overlay');
          if (old) old.remove();

          var overlay = document.createElement('div');
          overlay.className = 'lightbox-overlay';

          var box = document.createElement('div');
          box.className = 'lightbox-box';

          var closeBtn = document.createElement('button');
          closeBtn.className = 'lightbox-close';
          closeBtn.textContent = '✕';
          closeBtn.addEventListener('click', function() {
            overlay.remove();
          });

          var text = document.createElement('div');
          text.className = 'lightbox-text';
          text.textContent = el.getAttribute('data-tip') || '';

          var img = document.createElement('img');
          img.className = 'lightbox-img';
          img.src = imgSrc;
          img.alt = 'Screenshot';

          box.appendChild(closeBtn);
          box.appendChild(text);
          box.appendChild(img);
          overlay.appendChild(box);
          document.body.appendChild(overlay);

          overlay.addEventListener('click', function(e) {
            if (e.target === overlay) overlay.remove();
          });
        });
      });
    });

    function removeTooltip() {
      var t = document.querySelector('.floating-tooltip');
      if (t) t.remove();
    }

    function positionTooltip(e, tip) {
      var x = e.clientX + 14;
      var y = e.clientY + 14;
      var w = tip.offsetWidth || 200;
      var h = tip.offsetHeight || 80;
      if (x + w > window.innerWidth - 10) x = e.clientX - w - 14;
      if (y + h > window.innerHeight - 10) y = e.clientY - h - 14;
      if (x < 10) x = 10;
      if (y < 10) y = 10;
      tip.style.left = x + 'px';
      tip.style.top = y + 'px';
    }

    function closeModal() {
      google.script.host.close();
    }
  </script>
<?!= renderModalHelp('scores'); ?>
</body>
</html>
