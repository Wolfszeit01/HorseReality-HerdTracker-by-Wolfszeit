  <script>
    <?!= renderXpFunctions_(); ?>
    let xpContext = {previous:null,baseline:null};
    let xpReady = false;
    function readXpMetrics() {
      if (!xpReady) throw new Error('Wait for the previous snapshot to load.');
      if (document.getElementById('level').value === '' || document.getElementById('xp').value === '') throw new Error('Enter level and XP.');
      return xpMetrics_(Number(document.getElementById('level').value), Number(document.getElementById('xp').value), xpContext, XP_TABLE);
    }

    function recalcXP() {
      const level = parseInt(document.getElementById('level').value) || 0;
      const xp = parseInt(document.getElementById('xp').value) || 0;



      // XP_TABLE[level-1] = XP needed FOR this level (not cumulative)
      // User's "Total XP" = XP earned within current level
      const levelMax = XP_TABLE[level - 1];
      const tilNext = Math.max(0, levelMax - xp);
      const pct = levelMax > 0 ? Math.min(100, (xp / levelMax) * 100) : 0;
      let metrics;
      try { metrics = readXpMetrics(); } catch (error) {
        ['calcTilNext','calcPercent','calcSinceLast','calcDayTotal'].forEach(id => document.getElementById(id).textContent = '—');
        document.getElementById('progressWrap').style.display = 'none';
        return;
      }
      const sinceLast = metrics.sinceLast;

      document.getElementById('calcTilNext').textContent = tilNext.toLocaleString('en-US');
      document.getElementById('calcPercent').textContent = pct.toFixed(1) + '%';
      document.getElementById('calcSinceLast').textContent = xpContext.previous ? '+' + sinceLast.toLocaleString('en-US') : '—';
      document.getElementById('calcDayTotal').textContent = xpContext.baseline ? '+' + metrics.dayTotal.toLocaleString('en-US') : '—';

      document.getElementById('progressWrap').style.display = 'block';
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('progressLeft').textContent = xp.toLocaleString('en-US') + ' XP';
      document.getElementById('progressRight').textContent = levelMax.toLocaleString('en-US') + ' XP';
    }

    // Interest Rate Tiers
    const INTEREST_TIERS = [
      { max: 100000, rate: 1.50 },
      { max: 250000, rate: 1.00 },
      { max: 500000, rate: 0.80 },
      { max: 1000000, rate: 0.50 },
      { max: 2000000, rate: 0.30 },
      { max: 5000000, rate: 0.15 },
      { max: 10000000, rate: 0.10 },
      { max: 25000000, rate: 0.03 },
      { max: Infinity, rate: 0 }
    ];
    // Profitable breakpoints where moving to next tier costs more than you gain
    const PROFITABLE_CAPS = [100000, 250000, 500000, 1000000, 2000000, 5000000, 10000000, 25000000];

    function getInterestRate(amount) {
      for (const tier of INTEREST_TIERS) {
        if (amount <= tier.max) return tier.rate;
      }
      return 0;
    }

    function recalcInterest() {
      const savings = parseInt(document.getElementById('savings').value) || 0;
      const hrc = parseInt(document.getElementById('hrc').value) || 0;
      const total = savings + hrc;

      document.getElementById('interestInfo').style.display = savings > 0 ? 'block' : 'none';
      if (savings <= 0) return;

      const rate = getInterestRate(savings);
      const daily = Math.floor(savings * (rate / 100));
      const monthly = daily * 30;

      document.getElementById('calcRate').textContent = rate + '%';
      document.getElementById('calcDaily').textContent = '+' + daily.toLocaleString('en-US');
      document.getElementById('calcMonthly').textContent = '+' + monthly.toLocaleString('en-US');

      // Optimal tip: check if moving some to cash would yield better rate
      let tip = '';
      if (rate === 0) {
        tip = '⚠️ 0% interest! Anything over 25M earns nothing. Keep the surplus as cash.';
      } else {
        // Find optimal cap for current tier
        const currentTier = INTEREST_TIERS.find(t => savings <= t.max);
        const tierIndex = INTEREST_TIERS.indexOf(currentTier);
        if (tierIndex > 0) {
          const prevCap = PROFITABLE_CAPS[tierIndex - 1];
          const prevRate = INTEREST_TIERS[tierIndex - 1].rate;
          const dailyAtPrevCap = Math.floor(prevCap * (prevRate / 100));
          if (dailyAtPrevCap > daily) {
            tip = '💡 Tip: ' + prevCap.toLocaleString('en-US') + ' HRC in Savings (' + prevRate + '%) = ' + dailyAtPrevCap.toLocaleString('en-US') + '/day. Keep the rest as cash → more yield!';
          } else {
            tip = '✓ Current savings amount is efficient for ' + rate + '% interest.';
          }
        } else {
          tip = '✓ Optimal interest bracket (1.50%). Max. ' + PROFITABLE_CAPS[0].toLocaleString('en-US') + ' HRC recommended.';
        }
      }
      document.getElementById('savingsTip').innerHTML = tip;
    }

    window.onload = function() {
      google.script.run
        .withSuccessHandler(function(result) {
          xpContext = result.xpContext;
          xpReady = true;
          const data = result.entry;
          if (data && data.lastDate) {
            document.getElementById('lastEntry').style.display = 'block';
            document.getElementById('lastEntry').innerHTML = 'Last entry: <b>' + data.lastDate + '</b> — Level ' + data.level + ', ' + data.xp.toLocaleString('en-US') + ' XP';

            document.getElementById('level').value = data.level || '';
            document.getElementById('rank').value = data.rank || '';
            document.getElementById('hrc').value = data.hrc || 0;
            document.getElementById('savings').value = data.savings || 0;
            document.getElementById('dp').value = data.dp || 0;
            document.getElementById('ft').value = data.ft || 0;
            document.getElementById('wt').value = data.wt || 0;
            document.getElementById('totalStalls').value = data.totalStalls || 0;
            document.getElementById('horsesOnPasture').value = data.horsesOnPasture || 0;
          }
        })
        .withFailureHandler(function(error) {
          const status = document.getElementById('status');
          status.className = 'status error'; status.style.display = 'block'; status.textContent = 'Could not load XP history: ' + error.message;
        })
        .getXpSnapshotFormData();
    };

    function save() {
      let metrics;
      try { metrics = readXpMetrics(); } catch (error) {
        const status = document.getElementById('status');
        status.className = 'status error'; status.style.display = 'block'; status.textContent = error.message;
        return;
      }
      const level = parseInt(document.getElementById('level').value) || 0;
      const xp = parseInt(document.getElementById('xp').value) || 0;
      const levelMax = XP_TABLE[level - 1] || 0;
      const tilNext = Math.max(0, levelMax - xp);
      const pct = levelMax > 0 ? (xp / levelMax) * 100 : 0;

      const data = {
        level: level,
        rank: document.getElementById('rank').value.trim(),
        xp: xp,
        sinceLast: metrics.sinceLast,
        dayTotal: metrics.dayTotal,
        tilNext: tilNext,
        percent: pct,
        hrc: Number(document.getElementById('hrc').value) || 0,
        savings: Number(document.getElementById('savings').value) || 0,
        dp: Number(document.getElementById('dp').value) || 0,
        ft: Number(document.getElementById('ft').value) || 0,
        wt: Number(document.getElementById('wt').value) || 0,
        totalStalls: Number(document.getElementById('totalStalls').value) || 0,
        horsesOnPasture: Number(document.getElementById('horsesOnPasture').value) || 0
      };

      const st = document.getElementById('status');
      st.className = 'status'; st.style.display = 'none';

      google.script.run
        .withSuccessHandler(function(res) {
          if (res.success) {
            st.className = 'status success';
            st.innerHTML = '✓ Saved! Net Worth: <b>' + res.netWorth.toLocaleString('en-US') + '</b> HRC';
            setTimeout(function() { google.script.host.close(); }, 1500);
          } else { st.className = 'status error'; st.innerHTML = res.error; }
          st.style.display = 'block';
        })
        .withFailureHandler(function(err) { document.getElementById('status').className = 'status error'; document.getElementById('status').innerHTML = err.message; document.getElementById('status').style.display = 'block'; })
        .saveXpSnapshot(data);
    }
  </script>
<?!= renderModalHelp('snapshot'); ?>
</body>
</html>
